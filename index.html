<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Installment Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#4f46e5;--bg:#f3f4f8;--c:#fff;--t:#1f2937;--m:#6b7280;--g:#16a34a;--r:#dc2626;--o:#f59e0b;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--p);color:#fff;font-size:14px}
button.s{background:#e5e7eb;color:var(--t)}button.d{background:var(--r)}button.ok{background:var(--g)}button.sm{padding:5px 9px;font-size:12px}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;font-size:14px;background:#fff}
label{font-size:12px;color:var(--m);display:block;margin:8px 0 3px}
.login{max-width:360px;margin:12vh auto;background:var(--c);padding:28px;border-radius:14px;box-shadow:0 8px 30px #0001}
.shell{display:flex;min-height:100vh}.side{width:210px;background:#1e1b4b;color:#fff;padding:16px;flex-shrink:0}
.side h3{margin:0 0 16px}.side button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:4px}
.side button.a{background:#4f46e5}.main{flex:1;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--c);border-radius:12px;padding:14px;box-shadow:0 2px 8px #0000000d}.card b{font-size:20px;display:block;margin-top:4px}
.tw{overflow-x:auto;background:var(--c);border-radius:12px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}th{background:#f9fafb;color:var(--m)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bar>*{width:auto;flex:1;min-width:120px}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff}.Active{background:var(--o)}.Completed{background:var(--g)}
#modal,#dlg{position:fixed;inset:0;display:none;background:#0006;z-index:10;align-items:center;justify-content:center;padding:10px}
#dlg{z-index:20}.box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.row{display:flex;gap:6px}.row input{min-width:0}
#toasts{position:fixed;top:12px;right:12px;z-index:30}.toast{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;margin-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal .h{text-align:center;font-size:11px;color:var(--m)}
.cell{min-height:52px;border-radius:8px;padding:3px;font-size:11px;background:#f9fafb;border:1px solid var(--b);text-align:center}
.cell small{display:block;font-size:9px;opacity:.9}.paid{background:var(--g);color:#fff}.miss{background:var(--r);color:#fff}
.due{background:var(--o);color:#fff}.part{background:#0ea5e9;color:#fff}.up{background:#fff;color:var(--m)}.cell.x{cursor:pointer}
.prog{height:12px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--g)}
.ban{background:#dcfce7;color:#166534;padding:12px;border-radius:10px;text-align:center;font-weight:600;margin:8px 0}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--b)}
.nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:14px}.nav button.a{color:var(--p);font-weight:700}
.rm{padding:14px 14px 80px}.tag.pending{background:#0ea5e9}.tag.approved{background:var(--g)}.tag.rejected{background:var(--r)}
.catp{display:none;border:1px solid var(--b);border-radius:12px;margin:6px 0;padding:8px;max-height:320px;overflow:auto;background:#fff;box-shadow:0 6px 18px #0002}
.cath{font-weight:700;margin:12px 0 6px;font-size:13px;color:var(--p);position:sticky;top:-8px;background:#fff;padding:4px 0}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pc{display:flex;align-items:center;gap:8px;border:1px solid var(--b);border-radius:10px;padding:7px;cursor:pointer;font-size:12px;margin:0;color:var(--t)}
.pc span{font-size:26px}.pc small{display:block;color:var(--m)}.pc input{width:auto}.pc.on{background:#eef2ff;border-color:var(--p)}.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0000000d}
@media(max-width:760px){.shell{flex-direction:column}.side{width:auto;display:flex;gap:4px;overflow-x:auto;padding:8px}.side h3{display:none}.side button{width:auto;white-space:nowrap}.g2{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toasts"></div><div id="modal"></div><div id="dlg"></div>
<script>
/* ===== Helpers & storage ===== */
const $=q=>document.querySelector(q);let SESS=null;const DB={users:[],customers:[],installments:[]};
/* Data lives in Firestore. DB is a live in-memory copy of what the logged-in user may see; set() updates it instantly and FBsync() saves the changes to Firestore. */
const get=(k,d)=>k=='session'?SESS:(DB[k]||d),set=(k,v)=>{if(k=='session'){SESS=v;return}const old=DB[k];DB[k]=v;FBsync(k,old,v)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),rs=n=>'Rs. '+Math.round(n).toLocaleString('en-US');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>iso(new Date()),pd=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)},diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const U=()=>get('users',[]),C=()=>get('customers',[]),I=()=>get('installments',[]),S=()=>get('session',null);
const paidSum=i=>i.payments.reduce((s,p)=>s+p.amount,0),stat=i=>paidSum(i)>=i.remaining?'Completed':'Active',owed=(i,d)=>d<i.start?0:Math.min(i.remaining,(diff(d,i.start)+1)*i.daily),lateAmt=i=>Math.max(0,owed(i,addD(today(),-1))-paidSum(i)),dueNow=i=>Math.max(0,owed(i,today())-paidSum(i)),cov=(i,k)=>paidSum(i)>=Math.min(k*i.daily,i.remaining),custOf=id=>C().find(c=>c.id===id),planOf=cid=>I().find(i=>i.customerId===cid),userName=id=>(U().find(u=>u.id===id)||{}).name||'-';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2500)}
function M(h){$('#modal').innerHTML=`<div class="box">${h}</div>`;$('#modal').style.display='flex'}function closeM(){$('#modal').style.display='none'}
function ask(msg,fn){window._cb=fn;$('#dlg').innerHTML=`<div class="box" style="max-width:340px"><p>${msg}</p><div class="row"><button class="s" onclick="$('#dlg').style.display='none'">Cancel</button><button onclick="$('#dlg').style.display='none';_cb()">Confirm</button></div></div>`;$('#dlg').style.display='flex'}
function xl(name,rows){if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Sheet1');XLSX.writeFile(wb,name+'.xlsx')}else{const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name+'.csv';a.click()}}
/* Approval helpers: customers added by salesmen are 'pending' until admin approves */
const ok=c=>c.approval!=='pending'&&c.approval!=='rejected',PEND=()=>C().filter(c=>c.approval=='pending').length,PS=()=>I().filter(i=>{const c=custOf(i.customerId);return c&&ok(c)});
/* ===== Demo data ===== */
function seed(){if(U().length)return;set('users',[{id:'a1',role:'admin',name:'Administrator',username:'admin',password:'admin123'},{id:'r1',role:'recovery',name:'Ali Raza',phone:'0300-1234567',username:'ali',password:'ali123'}]);
const mk=(id,n,f,cn,ph,items,adv,start,paidDays)=>{const total=items.reduce((s,x)=>s+x.qty*x.price,0),rem=total-adv,days=Math.ceil(rem/100),pay=[];for(let k=0;k<paidDays;k++)pay.push({date:addD(start,k),amount:100,receivedBy:'Ali Raza',timestamp:new Date(pd(addD(start,k)).getTime()+36e5*12).toISOString()});
return[{id,name:n,father:f,address:'Block '+id.slice(-1)+', Karachi',cnic:cn,phone:ph,gName:'',gPhone:'',recoveryId:'r1'},{id:'p'+id,customerId:id,items,total,advance:adv,remaining:rem,daily:100,days,start,end:addD(start,days-1),payments:pay}]};
const a=mk('c1','Bilal Ahmed','Ahmed Khan','42101-1234567-1','0301-1112223',[{name:'LED TV',qty:1,price:30000}],25000,addD(today(),-12),9),b=mk('c2','Sara Khan','Imran Khan','42201-7654321-2','0302-4445556',[{name:'Washing Machine',qty:1,price:18000},{name:'Iron',qty:1,price:2000}],10000,addD(today(),-4),4);
set('customers',[a[0],b[0]]);set('installments',[a[1],b[1]])}
/* ===== Auth ===== */
let ui={view:'dash',q:'',st:'',cal:{}};
function loginView(){$('#app').innerHTML=`<div class="login"><h2>📒 Installment Manager</h2><label>Username</label><input id="lu"><label>Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')doLogin()"><br><br><button style="width:100%" onclick="doLogin()">Login</button><p style="font-size:12px;color:var(--m)">Enter your username (admin: full email if needed)</p></div>`}
function doLogin(){FB.login($('#lu').value.trim(),$('#lp').value)}
function logout(){FB.logout()}
function chPass(){M(`<h3>Change password</h3><label>Current</label><input id="o" type="password"><label>New (min 6 chars)</label><input id="n" type="password"><br><br><div class="row"><button class="s" onclick="closeM()">Cancel</button><button onclick="savePass()">Save</button></div>`)}
function savePass(){FB.changePass($('#o').value,$('#n').value)}
function render(){const s=S();if(!s||!U().find(u=>u.id===s.userId)){botUnmount();return loginView()}({admin:adminShell,sales:salShell}[s.role]||recShell)();s.role=='admin'?botMount():botUnmount()}
/* ===== Payments (any amount: partial, advance, late, full settlement) ===== */
function addPay(iid,amt,by){const l=I(),i=l.find(x=>x.id===iid),left=i.remaining-paidSum(i);amt=Math.min(Math.round(amt),left);if(amt<=0)return null;const p={date:today(),amount:amt,receivedBy:by,receivedByUid:S().userId,timestamp:new Date().toISOString()};i.payments.push(p);set('installments',l);return p}
function unpay(iid,ts){const l=I(),i=l.find(x=>x.id===iid);i.payments=i.payments.filter(p=>p.timestamp!==ts);set('installments',l)}
function receipt(iid,ts){const i=I().find(x=>x.id===iid),c=custOf(i.customerId),p=i.payments.find(x=>x.timestamp===ts),w=window.open('','_blank','width=380,height=540');if(!w)return toast('Allow popups');
w.document.write(`<body style="font-family:sans-serif;max-width:300px"><h3 style="text-align:center">Payment Receipt</h3><hr><p>Customer: ${esc(c.name)}<br>Date: ${p.date}<br>Time: ${new Date(p.timestamp).toLocaleTimeString()}<br>Amount: <b>${rs(p.amount)}</b><br>Received by: ${esc(p.receivedBy)}<br>Total paid: ${rs(paidSum(i))}<br>Remaining: <b>${rs(Math.max(0,i.remaining-paidSum(i)))}</b></p><hr><p style="text-align:center">Thank you</p><script>print()<\/script>`);w.document.close()}
function payDlg(iid){const i=I().find(x=>x.id===iid),c=custOf(i.customerId),bal=i.remaining-paidSum(i),due=dueNow(i),late=lateAmt(i);
$('#dlg').innerHTML=`<div class="box" style="max-width:380px"><h3 style="margin-top:0">${esc(c.name)}</h3><p style="font-size:13px;line-height:1.7">Balance <b>${rs(bal)}</b> · Daily ${rs(i.daily)}<br>Due till today <b>${rs(due)}</b>${late>0?` · <span style="color:var(--r)">Late ${rs(late)}</span>`:''}</p>
<div class="row" style="flex-wrap:wrap">${[['Daily',i.daily],['Due till today',due],['Full balance',bal]].filter(x=>x[1]>0).map(([l,v])=>`<button class="s sm" onclick="$('#pa').value=${Math.min(v,bal)};pv('${iid}')">${l}: ${rs(Math.min(v,bal))}</button>`).join('')}</div>
<div style="margin-top:6px"><button class="d sm" onclick="$('#pa').value=0;pv('${iid}')">✖ No payment received (0)</button></div><label>Amount received (Rs.) — any amount, or 0 if customer paid nothing</label><input id="pa" type="number" min="0" max="${bal}" value="${Math.min(bal,due>0?due:i.daily)}" oninput="pv('${iid}')"><p id="pvw" style="font-size:13px;background:#eef2ff;padding:9px;border-radius:8px"></p>
<div class="row"><button class="s" onclick="$('#dlg').style.display='none'">Cancel</button><button class="ok" onclick="payGo('${iid}')">Receive ✔</button></div></div>`;$('#dlg').style.display='flex';pv(iid)}
function pv(iid){const i=I().find(x=>x.id===iid),a=Math.min(+$('#pa').value||0,i.remaining-paidSum(i)),P=paidSum(i)+a,cd=P>=i.remaining?i.days:Math.floor(P/i.daily);let m;
if($('#pa').value.trim()==='')m='Enter an amount';else if(a<=0)m='No payment will be recorded (customer did not pay today)';else if(P>=i.remaining)m='🎉 Plan will be COMPLETED (all days green)';else{m=`Calendar: <b>${cd}/${i.days}</b> days paid · Remaining <b>${rs(i.remaining-P)}</b>`;const need=owed(i,today())-P;m+=need>0?` · <span style="color:var(--r)">Still due ${rs(need)}</span>`:cd>diff(today(),i.start)+1?` · Paid ahead till ${addD(i.start,cd-1)}`:' · Up to date ✔'}$('#pvw').innerHTML=m}
function payGo(iid){const i=I().find(x=>x.id===iid),a=+$('#pa').value,bal=i.remaining-paidSum(i);if($('#pa').value.trim()===''||isNaN(a)||a<0)return toast('Enter a valid amount');if(a===0){const l=I(),j=l.find(x=>x.id===iid);j.payments.push({date:today(),amount:0,noPay:true,receivedByUid:S().userId,receivedBy:userName(S().userId),timestamp:new Date().toISOString()});set('installments',l);$('#dlg').style.display='none';toast('No payment received — recorded');render();if($('#modal').style.display=='flex')openCust(i.customerId);return}if(a>bal)return toast('Amount exceeds balance '+rs(bal));
const p=addPay(iid,a,userName(S().userId));$('#dlg').style.display='none';toast(rs(p.amount)+' received');render();if($('#modal').style.display=='flex')openCust(i.customerId);setTimeout(()=>ask('Print receipt?',()=>receipt(iid,p.timestamp)),150)}
function doUnpay(iid,ts){ask('Undo this payment? Calendar will be recalculated.',()=>{unpay(iid,ts);toast('Payment removed');render();openCust(I().find(x=>x.id===iid).customerId)})}
/* ===== Calendar (days are filled in order from the total paid amount) ===== */
function calHtml(i,role){const t=today(),sm=pd(i.start),em=pd(i.end),P=paidSum(i),done=stat(i)=='Completed',cd=done?i.days:Math.floor(P/i.daily),late=lateAmt(i);let m=ui.cal[i.id];if(!m){const base=pd(t)>em?em:pd(t)<sm?sm:pd(t);m=ui.cal[i.id]=base.getFullYear()*12+base.getMonth()}
const y=Math.floor(m/12),mo=m%12,first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate();
let h=`${done?'<div class="ban">🎉 Congratulations! All installments are paid — plan Completed.</div>':''}<div class="prog"><i style="width:${Math.min(100,P/i.remaining*100)}%"></i></div><div style="font-size:13px">${cd}/${i.days} days paid · Paid ${rs(P)} · Remaining <b>${rs(Math.max(0,i.remaining-P))}</b>${late>0?` · <span style="color:var(--r)">Late ${rs(late)}</span>`:''}</div>
<div class="top" style="margin:10px 0 0"><button class="s sm" onclick="calNav('${i.id}',-1)">◀</button><b>${first.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="s sm" onclick="calNav('${i.id}',1)">▶</button></div><div class="cal">${'SMTWTFS'.split('').map(x=>`<div class="h">${x}</div>`).join('')}${'<div></div>'.repeat(first.getDay())}`;
for(let d=1;d<=n;d++){const ds=iso(new Date(y,mo,d)),k=diff(ds,i.start)+1;if(k<1||k>i.days){h+=`<div class="cell" style="opacity:.3">${d}</div>`;continue}
const full=cov(i,k),part=!full&&P>(k-1)*i.daily,cl=full?'paid':part?'part':ds<t?'miss':ds==t?'due':'up';h+=`<div class="cell ${cl} x" onclick="cellClick('${i.id}',${k})">${d}<small>Day ${k}/${i.days}</small></div>`}
return h+`</div><p style="font-size:11px;color:var(--m)">🟢 Paid · 🔵 Partly paid · 🔴 Missed · 🟡 Today · ⚪ Upcoming</p>`}
function calNav(iid,d){ui.cal[iid]+=d;openCust(I().find(x=>x.id===iid).customerId)}
function cellClick(iid,k){const i=I().find(x=>x.id===iid);if(S().role=='sales'||!ok(custOf(i.customerId)))return toast('View only');if(stat(i)=='Completed'||cov(i,k))return toast('This day is already paid');payDlg(iid)}
function openCust(cid){const c=custOf(cid),i=planOf(cid),role=S().role;if(!i)return;const hist=[...i.payments].reverse();
M(`<div class="top"><h3 style="margin:0">${esc(c.name)} <span class="tag ${stat(i)}">${stat(i)}</span></h3><div class="row">${role=='admin'?`<button class="sm" onclick="exportLedger('${cid}')">Export</button>`:''}<button class="s sm" onclick="closeM()">Close</button></div></div>
<p style="font-size:13px;line-height:1.6">S/O ${esc(c.father)} · ${esc(c.cnic)}<br>📞 <a href="tel:${esc(c.phone)}">${esc(c.phone)}</a> · ${esc(c.address)}${c.gName?`<br>Guarantor: ${esc(c.gName)} ${esc(c.gPhone)}`:''}<br>Recovery man: ${c.recoveryId?esc(userName(c.recoveryId)):'— not assigned yet —'}<br>Added by: ${c.addedBy?esc(userName(c.addedBy)):'Admin'} · Status: <b>${(c.approval||'approved').toUpperCase()}</b>${c.rejectReason?' — '+esc(c.rejectReason):''}</p>
<div class="tw" style="margin:0"><table><tr><th>Item</th><th>Qty</th><th>Price</th></tr>${i.items.map(x=>`<tr><td>${x.icon||'📦'} ${esc(x.name)}</td><td>${x.qty}</td><td>${rs(x.price)}</td></tr>`).join('')}</table></div>
<p style="font-size:13px">With us since <b>${i.start}</b> · <b>${i.items.reduce((a,x)=>a+x.qty,0)} pieces</b> given on installment<br>Total ${rs(i.total)} · Advance ${rs(i.advance)} · Balance ${rs(i.remaining)} · ${rs(i.daily)}/day × ${i.days} days<br>${i.start} → ${i.end} · Paid ${rs(paidSum(i))}</p>
${stat(i)=='Active'&&role!='sales'&&ok(c)?`<button class="ok" style="width:100%;margin:6px 0" onclick="payDlg('${i.id}')">💵 Receive Payment (any amount)</button>`:''}${calHtml(i,role)}
<h4>Payment history (${hist.length})</h4><div class="tw" style="margin:0;max-height:220px;overflow:auto"><table>${hist.map(p=>`<tr><td>${p.date}</td><td>${p.amount?rs(p.amount):'<span style="color:var(--r)">No payment received</span>'}</td><td>${esc(p.receivedBy)}</td><td class="row">${p.amount?`<button class="s sm" onclick="receipt('${i.id}','${p.timestamp}')">Receipt</button>`:''}${role=='admin'?`<button class="d sm" onclick="doUnpay('${i.id}','${p.timestamp}')">Undo</button>`:''}</td></tr>`).join('')||'<tr><td>No payments yet</td></tr>'}</table></div>`)}
/* ===== Admin ===== */
const AN=[['dash','📊 Dashboard'],['appr','✅ Approvals'],['cust','👥 Customers'],['rec','🚚 Recovery Men'],['sal','🧑‍💼 Salesmen'],['rep','📅 Daily Report'],['bak','💾 Backup']];
function adminShell(){const v={dash:vDash,appr:vAppr,cust:vCust,rec:vRec,sal:vSal,rep:vRep,bak:vBak}[ui.view]();$('#app').innerHTML=`<div class="shell"><div class="side"><h3>📒 Installments</h3>${AN.map(([k,l])=>`<button class="${ui.view==k?'a':''}" onclick="ui.view='${k}';render()">${l}${k=='appr'&&PEND()?` <b style="background:#ef4444;border-radius:9px;padding:0 6px">${PEND()}</b>`:''}</button>`).join('')}<button onclick="chPass()">🔑 Password</button><button onclick="logout()">⎋ Logout</button></div><div class="main">${v}</div></div>`}
function vDash(){const t=today(),cs=C().filter(ok),ps=PS(),act=ps.filter(i=>stat(i)=='Active'),all=ps.flatMap(i=>i.payments);

import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const clean=o=>JSON.parse(JSON.stringify(o)),sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(x=>[x,v[x]])):v);
const last={users:{},customers:{},installments:{},pay:{}};let Q=Promise.resolve(),unsubs=[],tk,ROLE='';
const kick=()=>{clearTimeout(tk);tk=setTimeout(()=>APP.render(),60)};
/* Each plan carries copies of its customer's recoveryId / addedBy / approval so Security Rules can check them */
function docFor(k,o){o=clean(o);if(k=='users')delete o.password;if(k=='installments'){const c=APP.DB.customers.find(x=>x.id==o.customerId)||{};Object.assign(o,clean({recoveryId:c.recoveryId||'',addedBy:c.addedBy||'',approval:c.approval||'approved'}))}return o}
async function run(k,list){const seen=new Set();for(const o of list){const d=docFor(k,o),j=sj(d);seen.add(o.id);if(last[k][o.id]!==j){if(ROLE=='recovery'&&k=='installments'){const pj=sj(d.payments||[]);if(pj!==last.pay[o.id]){await updateDoc(doc(db,k,o.id),{payments:d.payments});last.pay[o.id]=pj}}else await setDoc(doc(db,k,o.id),d);last[k][o.id]=j}}
for(const id of Object.keys(last[k]))if(!seen.has(id)){await deleteDoc(doc(db,k,id));delete last[k][id]}}
window.FBsync=(k,old,nv)=>{Q=Q.then(async()=>{await run(k,nv);if(k=='customers')await run('installments',APP.DB.installments)}).catch(e=>{console.error(e);APP.toast('Save failed: '+(e.code||e.message))})};
function listen(u,role){unsubs.forEach(x=>x());unsubs=[];const col=n=>collection(db,n),q=n=>role=='admin'?col(n):role=='recovery'?query(col(n),where('recoveryId','==',u.uid),where('approval','==','approved')):query(col(n),where('addedBy','==',u.uid));
const take=(n,s)=>{APP.DB[n]=s.docs.map(d=>({...d.data(),id:d.id}));last[n]=Object.fromEntries(s.docs.map(d=>[d.id,sj(clean(d.data()))]));if(n=='installments')last.pay=Object.fromEntries(s.docs.map(d=>[d.id,sj(d.data().payments||[])]));kick()};
for(const n of['customers','installments'])unsubs.push(onSnapshot(q(n),s=>take(n,s),e=>APP.toast('Load error: '+e.code)));
if(role=='admin')unsubs.push(onSnapshot(col('users'),s=>take('users',s),e=>APP.toast('Load error: '+e.code)))}
onAuthStateChanged(auth,async u=>{unsubs.forEach(x=>x());unsubs=[];
if(!u){APP.setSess(null);Object.assign(APP.DB,{users:[],customers:[],installments:[]});APP.render();return}
try{const s=await getDoc(doc(db,'users',u.uid));if(!s.exists()){APP.toast('Account has no profile. Ask the admin.');await signOut(auth);return}
const me={...s.data(),id:u.uid};ROLE=me.role;APP.DB.users=[me];APP.setSess({userId:u.uid,role:me.role});APP.ui.view={admin:'dash',sales:'mine'}[me.role]||'today';listen(u,me.role);APP.render()}
catch(e){APP.toast('Login error: '+(e.code||e.message));await signOut(auth)}});
window.FB={
 async login(id,pw){if(!id||!pw)return APP.toast('Enter username and password');try{await signInWithEmailAndPassword(auth,id.includes('@')?id:id.toLowerCase()+'@'+DOMAIN,pw)}catch(e){console.error(e);APP.toast('Login failed: '+(e.code||e.message))}},
 logout(){signOut(auth)},
 async changePass(o,n){if(n.length<6)return APP.toast('New password: min 6 characters');try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,o));await updatePassword(u,n);closeM();APP.toast('Password changed')}catch(e){APP.toast('Current password is wrong')}},
 async createUser(p,pw){try{const a2=getAuth(initializeApp(firebaseConfig,'sec'+Date.now())),un=p.username.toLowerCase(),c=await createUserWithEmailAndPassword(a2,un+'@'+DOMAIN,pw);await signOut(a2);await setDoc(doc(db,'users',c.user.uid),{...p,username:un});closeM();APP.toast('User created')}catch(e){APP.toast(e.code=='auth/email-already-in-use'?'This username already exists in Firebase':'Error: '+(e.code||e.message))}}
};
</script>
</body></html>
